name: Scraper Stagéo

# Fréquence : voir scrapers/README.md ("Ajuster la fréquence") pour comment
# resserrer/relâcher le cron sans toucher au reste du workflow.
on:
  schedule:
    # Tous les lundis à 06h00 UTC (07h/08h heure belge selon l'heure d'été).
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # bouton "Run workflow" dans l'onglet Actions, pour tester sans attendre le cron

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Herstal + Huy consomment ~4 min à eux seuls (Crawl-delay iMio 120s) - large marge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r scrapers/requirements.txt

      - name: Installer Chromium (Playwright, pour les sites 100% JS)
        run: playwright install --with-deps chromium
        # Nécessaire pour les scrapers utilisant common.fetch_rendered_html()
        # (sites qui ne rendent rien en HTML brut, ex. Côté Campagne,
        # Village des Benjamins) - ajoute ~1-2 min au run mais reste gratuit
        # dans les volumes actuels de GitHub Actions.

      - name: Lancer le scraper (+ import Supabase + contrôle qualité)
        id: scrape
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python run_all.py
        # Code de sortie non nul (erreur d'import Supabase OU chute de plus
        # de 50% du nombre d'activités par rapport au dernier run sain) ->
        # ce step échoue -> le job est rouge dans l'onglet Actions.
        # `id` posé ici pour que les deux étapes d'email ci-dessous puissent
        # se déclencher indépendamment l'une de l'autre (voir leurs `if:`) :
        # l'échec du digest hebdo ne doit pas empêcher l'envoi des alertes
        # personnalisées, et inversement.

      - name: Envoyer l'email hebdomadaire (nouvelles activités)
        if: steps.scrape.outcome == 'success'
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: python brevo_digest.py
        # Ne tourne que si le scrape ci-dessus a réussi : on ne veut pas
        # prévenir les abonnés sur base d'un run en échec/incomplet.

      - name: Envoyer les alertes personnalisées (critères parents)
        if: steps.scrape.outcome == 'success'
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: python criteres_alertes.py
        # Volontairement indépendant du step précédent (`if` basé sur
        # steps.scrape, pas sur le digest) : un souci ponctuel sur la
        # campagne groupée ne doit pas priver les familles qui attendent
        # une alerte individuelle sur une place qui part vite.

      - name: Conserver la sortie du run (debug)
        if: always() # même si le step précédent a échoué - c'est justement quand on veut inspecter la sortie
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: |
            scrapers/output/activites.json
            scrapers/output/activites.csv
            scrapers/output/timings.txt
          retention-days: 30
