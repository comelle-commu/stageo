name: Scraper Stagéo

# Fréquence : voir scrapers/README.md ("Ajuster la fréquence") pour comment
# resserrer/relâcher le cron sans toucher au reste du workflow.
on:
  schedule:
    # Tous les lundis à 06h00 UTC (07h/08h heure belge selon l'heure d'été).
    - cron: "0 6 * * 1"
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions, pour tester sans attendre le cron
    inputs:
      test_email:
        description: "Si rempli, les alertes personnalisées et la relance critères ne sont envoyées qu'à cette adresse (test sans risquer d'écrire aux vraies familles inscrites)."
        required: false
        default: ""
      skip_scrape:
        description: "Sauter le scrape complet des ~40 sites (plusieurs minutes) et envoyer le digest/les alertes directement sur les données déjà en base - pratique pour tester rapidement un email."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Aperçu sans rien envoyer (affiche les destinataires visés dans les logs du run) - utile pour la relance critères, dont on ne peut pas se tester soi-même une fois ses critères déjà remplis."
        required: false
        type: boolean
        default: false
      check_email_stats:
        description: "Diagnostic seul (lecture Brevo, n'envoie rien) : affiche qui a ouvert/cliqué les emails déjà envoyés au lieu de lancer le scrape/les envois habituels."
        required: false
        type: boolean
        default: false
      stats_email:
        description: "check_email_stats : restreindre à un destinataire précis (vide = tous)."
        required: false
        default: ""
      stats_days:
        description: "check_email_stats : fenêtre en jours à consulter."
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Herstal + Huy consomment ~4 min à eux seuls (Crawl-delay iMio 120s) - large marge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r scrapers/requirements.txt

      - name: Installer Chromium (Playwright, pour les sites 100% JS)
        if: inputs.skip_scrape != true && inputs.check_email_stats != true
        run: playwright install --with-deps chromium
        # Nécessaire pour les scrapers utilisant common.fetch_rendered_html()
        # (sites qui ne rendent rien en HTML brut, ex. Côté Campagne,
        # Village des Benjamins) - ajoute ~1-2 min au run mais reste gratuit
        # dans les volumes actuels de GitHub Actions.

      - name: Lancer le scraper (+ import Supabase + contrôle qualité)
        id: scrape
        if: inputs.skip_scrape != true && inputs.check_email_stats != true
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python run_all.py
        # Code de sortie non nul (erreur d'import Supabase OU chute de plus
        # de 50% du nombre d'activités par rapport au dernier run sain) ->
        # ce step échoue -> le job est rouge dans l'onglet Actions.
        # `id` posé ici pour que les deux étapes d'email ci-dessous puissent
        # se déclencher indépendamment l'une de l'autre (voir leurs `if:`) :
        # l'échec du digest hebdo ne doit pas empêcher l'envoi des alertes
        # personnalisées, et inversement.

      - name: Envoyer l'email hebdomadaire (nouvelles activités)
        if: inputs.skip_scrape != true && inputs.check_email_stats != true && steps.scrape.outcome == 'success'
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: python brevo_digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
        # Ne tourne que si le scrape ci-dessus a réussi : on ne veut pas
        # prévenir les abonnés sur base d'un run en échec/incomplet. Exclu
        # de skip_scrape volontairement (contrairement aux alertes ci-
        # dessous) : c'est une campagne groupée vers toute la liste Brevo,
        # pas un test personnalisé restreint - on ne veut pas qu'un test
        # rapide déclenche accidentellement un envoi à tout le monde.

      - name: Envoyer les alertes personnalisées (critères parents)
        if: inputs.check_email_stats != true && (inputs.skip_scrape == true || steps.scrape.outcome == 'success')
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ALERTES_TEST_EMAIL: ${{ inputs.test_email }}
        run: python criteres_alertes.py ${{ inputs.dry_run && '--dry-run' || '' }}
        # Volontairement indépendant du step précédent (`if` basé sur
        # steps.scrape, pas sur le digest) : un souci ponctuel sur la
        # campagne groupée ne doit pas priver les familles qui attendent
        # une alerte individuelle sur une place qui part vite.

      - name: Relancer les inscrit·es sans critères
        if: inputs.check_email_stats != true && (inputs.skip_scrape == true || steps.scrape.outcome == 'success')
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          RELANCE_TEST_EMAIL: ${{ inputs.test_email }}
        run: python relance_criteres.py ${{ inputs.dry_run && '--dry-run' || '' }}
        # Ne dépend d'aucune donnée fraîchement scrapée (juste Brevo +
        # criteres_parents) - placé ici par cohérence avec les deux autres
        # jobs d'email plutôt que pour une vraie dépendance au scrape.

      - name: Consulter les statistiques email (diagnostic)
        if: inputs.check_email_stats == true
        working-directory: scrapers
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: >
          python email_stats.py
          --days "${{ inputs.stats_days }}"
          ${{ inputs.stats_email != '' && format('--email {0}', inputs.stats_email) || '' }}
        # Diagnostic pur, lecture seule côté Brevo (ouvertures/clics des
        # emails déjà envoyés) - n'envoie jamais rien. Volontairement
        # exclusif avec le reste du run (voir les `if:` ci-dessus) plutôt
        # qu'ajouté en step supplémentaire : pas de raison de scraper/
        # envoyer quoi que ce soit juste pour consulter des statistiques.

      - name: Conserver la sortie du run (debug)
        if: always() # même si le step précédent a échoué - c'est justement quand on veut inspecter la sortie
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: |
            scrapers/output/activites.json
            scrapers/output/activites.csv
            scrapers/output/timings.txt
          retention-days: 30
